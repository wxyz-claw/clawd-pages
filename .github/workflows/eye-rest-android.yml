name: Eye Rest Android

on:
  push:
    branches:
      - feature/eye-rest-android-prototype
    paths:
      - eye-rest-android/build-trigger.txt
  pull_request:
    branches:
      - main
    paths:
      - eye-rest-android/**
      - .github/workflows/eye-rest-android.yml
  workflow_dispatch:
    inputs:
      baseline:
        description: Verify original prototype source using the repaired toolchain
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eye-rest-android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.baseline && 'dc8d0b7760d1af5e3c0f7f219d1110ac9b9cc601' || github.ref }}

      - name: Add test-only baseline renderer
        if: inputs.baseline
        shell: bash
        run: |
          git fetch --depth=1 origin "$GITHUB_SHA"
          git show "$GITHUB_SHA:eye-rest-android/verification/BaselineRenderTest.kt" > app/src/test/java/com/wxyz/eyerest/BaselineRenderTest.kt
          python3 - <<'PY'
          from pathlib import Path
          p = Path('app/build.gradle.kts')
          text = p.read_text().replace('unitTests.isReturnDefaultValues = true', 'unitTests.isReturnDefaultValues = true\n        unitTests.isIncludeAndroidResources = true')
          text = text.replace('testImplementation("junit:junit:4.13.2")', 'testImplementation("junit:junit:4.13.2")\n    testImplementation("org.robolectric:robolectric:4.14.1")')
          p.write_text(text)
          with Path('gradle.properties').open('a') as f:
              f.write('\nandroid.useAndroidX=true\n')
          PY

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run unit tests and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle testDebugUnitTest lintDebug assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Upload tests, lint, and native view renders
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eye-rest-android-verification
          path: |
            eye-rest-android/app/build/reports
            eye-rest-android/app/build/test-results
            eye-rest-android/app/build/screenshots
          if-no-files-found: warn

      - name: Verify APK integrity and signing certificate
        if: success()
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk > apk-signature.txt
          sha256sum app/build/outputs/apk/debug/app-debug.apk > apk-sha256.txt
          unzip -t app/build/outputs/apk/debug/app-debug.apk > apk-integrity.txt

      - name: Upload APK verification
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eye-rest-android-apk-verification
          path: eye-rest-android/apk-*.txt
          if-no-files-found: error

      - name: Upload Gradle build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eye-rest-android-build-log
          path: eye-rest-android/build.log
          if-no-files-found: error

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eye-rest-android-debug-apk
          path: eye-rest-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
