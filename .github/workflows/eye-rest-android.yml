name: Eye Rest Android

on:
  push:
    branches:
      - feature/eye-rest-android-prototype
    paths:
      - eye-rest-android/build-trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: eye-rest-android

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"

      - name: Run unit tests and build debug APK
        run: gradle testDebugUnitTest assembleDebug --stacktrace --no-daemon

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: eye-rest-android-debug-apk
          path: eye-rest-android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
