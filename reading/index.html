<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reading Stack · Clawd Pages</title>
  <meta name="description" content="Articles and posts Jason saved to come back to — full copies, kept locally.">
  <meta name="theme-color" content="#0e1116">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0e1116;
      --card: #151a21;
      --card-edge: #242c37;
      --text: #e9edf2;
      --muted: #8b95a3;
      --rose: #ef6a7a;
      --blue: #1d9bf0;
      --amber: #f7b955;
      --green: #3ddc84;
      --display: 'Space Grotesk', ui-sans-serif, sans-serif;
      --serif: 'Lora', Georgia, serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--serif);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
      padding: 56px 20px 80px;
    }

    /* ---------- Ambient: layered glow + faint ruled paper ---------- */
    .bg { position: fixed; inset: 0; z-index: -1; }
    .bg::before, .bg::after {
      content: '';
      position: absolute;
      width: 620px; height: 620px;
      border-radius: 50%;
      filter: blur(10px);
    }
    .bg::before {
      left: -180px; top: -220px;
      background: radial-gradient(circle, rgba(239, 106, 122, 0.13), transparent 65%);
      animation: drift 18s ease-in-out infinite alternate;
    }
    .bg::after {
      right: -200px; bottom: -240px;
      background: radial-gradient(circle, rgba(29, 155, 240, 0.10), transparent 65%);
      animation: drift 21s ease-in-out -7s infinite alternate-reverse;
    }
    .bg .rules {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 31px,
        rgba(255, 255, 255, 0.028) 31px 32px
      );
      -webkit-mask-image: radial-gradient(ellipse 100% 90% at 50% 30%, #000 20%, transparent 100%);
      mask-image: radial-gradient(ellipse 100% 90% at 50% 30%, #000 20%, transparent 100%);
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(42px, 30px) scale(1.07); }
    }

    .page { max-width: 720px; margin: 0 auto; position: relative; }

    /* Notebook margin line (desktop) */
    @media (min-width: 760px) {
      .page::before {
        content: '';
        position: absolute;
        left: -34px; top: 8px; bottom: 0;
        width: 1px;
        background: linear-gradient(to bottom, rgba(239, 106, 122, 0.55), rgba(239, 106, 122, 0.06));
      }
    }

    .reveal { animation: rise 0.6s cubic-bezier(0.22, 0.9, 0.3, 1) backwards; animation-delay: var(--d, 0ms); }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    /* ---------- Masthead ---------- */
    .masthead {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
      margin-bottom: 44px;
    }
    .eyebrow {
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--rose);
      margin-bottom: 10px;
    }
    h1 {
      font-family: var(--display);
      font-size: clamp(2.1rem, 6vw, 2.9rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .tagline {
      font-style: italic;
      color: var(--muted);
      font-size: 0.98rem;
      margin-top: 12px;
      max-width: 42ch;
    }
    .stamp {
      flex: 0 0 auto;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      color: var(--rose);
      border: 1.5px dashed rgba(239, 106, 122, 0.5);
      padding: 10px 12px;
      border-radius: 6px;
      transform: rotate(-2.5deg);
      text-align: center;
      line-height: 1.5;
      white-space: nowrap;
      margin-top: 8px;
      background: rgba(239, 106, 122, 0.04);
    }

    /* ---------- Stack ---------- */
    .stack { display: flex; flex-direction: column; gap: 30px; }

    .clip {
      position: relative;
      background: var(--card);
      border: 1px solid var(--card-edge);
      border-radius: 14px;
      padding: 26px 26px 20px;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .clip:hover {
      transform: translateY(-3px);
      border-color: rgba(239, 106, 122, 0.4);
      box-shadow: 0 18px 40px -20px rgba(0, 0, 0, 0.7);
    }

    /* Bookmark ribbon, color-coded by type */
    .ribbon {
      position: absolute;
      left: 26px; top: -9px;
      width: 15px; height: 58px;
      background: var(--type-color, var(--rose));
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%);
      box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.6);
      transition: height 0.25s ease, transform 0.25s ease;
    }
    .clip:hover .ribbon { height: 66px; }
    .clip[data-type="tweet"]   { --type-color: var(--blue); }
    .clip[data-type="article"] { --type-color: var(--amber); }
    .clip[data-type="video"]   { --type-color: var(--green); }
    .clip[data-type="note"]    { --type-color: var(--rose); }

    .clip-top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 14px;
      padding-left: 26px;
    }
    .src {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--type-color, var(--rose));
    }
    .glyph {
      display: grid; place-items: center;
      width: 22px; height: 22px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      background: color-mix(in srgb, var(--type-color, var(--rose)) 16%, transparent);
      border: 1px solid color-mix(in srgb, var(--type-color, var(--rose)) 34%, transparent);
    }
    .clip[data-type="tweet"] .glyph   { font-family: var(--display); }
    .saved {
      font-family: var(--mono);
      font-size: 0.64rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      white-space: nowrap;
    }

    .clip h2 {
      font-family: var(--display);
      font-size: 1.38rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .clip h2 a {
      color: var(--text);
      text-decoration: none;
      background-image: linear-gradient(var(--rose), var(--rose));
      background-size: 0% 2px;
      background-repeat: no-repeat;
      background-position: 0 100%;
      transition: background-size 0.3s ease;
    }
    .clip h2 a:hover { background-size: 100% 2px; }

    .byline {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }
    .byline a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted rgba(139, 149, 163, 0.5); }
    .byline a:hover { color: var(--text); }

    .excerpt {
      font-size: 1.02rem;
      line-height: 1.7;
      color: #c7cdd6;
      border-left: 2px solid rgba(239, 106, 122, 0.5);
      padding-left: 16px;
      margin-bottom: 18px;
    }

    /* ---------- Clawd's notes (summary panel) ---------- */
    .summary {
      position: relative;
      background:
        linear-gradient(180deg, color-mix(in srgb, var(--rose) 9%, transparent), color-mix(in srgb, var(--rose) 4%, transparent));
      border: 1px solid color-mix(in srgb, var(--rose) 26%, transparent);
      border-left: 3px solid var(--rose);
      border-radius: 4px 12px 12px 4px;
      padding: 15px 18px 14px;
      margin-bottom: 18px;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .summary:hover {
      border-color: color-mix(in srgb, var(--rose) 48%, transparent);
      box-shadow: 0 10px 30px -18px rgba(239, 106, 122, 0.35);
    }
    .summary-label {
      display: flex; align-items: center; gap: 8px;
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--rose);
      margin-bottom: 9px;
    }
    .summary-label::before {
      content: '';
      width: 7px; height: 7px;
      background: var(--rose);
      transform: rotate(45deg);
      flex: 0 0 auto;
      box-shadow: 0 0 8px rgba(239, 106, 122, 0.7);
    }
    .summary-text {
      font-size: 1.03rem;
      line-height: 1.72;
      color: #dde3ea;
      margin-bottom: 11px;
    }
    .takeaways { list-style: none; display: flex; flex-direction: column; gap: 7px; }
    .takeaways li {
      position: relative;
      padding-left: 20px;
      font-size: 0.93rem;
      line-height: 1.62;
      color: #c0c9d3;
      transition: color 0.2s ease;
    }
    .takeaways li:hover { color: #e4e9ef; }
    .takeaways li::before {
      content: '▸';
      position: absolute; left: 2px; top: 0.05em;
      color: var(--rose);
      font-size: 0.8rem;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .chip {
      font-family: var(--mono);
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      border: 1px solid var(--card-edge);
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.02);
      transition: color 0.2s ease, border-color 0.2s ease, transform 0.2s ease;
    }
    .chip:hover { color: var(--text); border-color: var(--type-color, var(--rose)); transform: translateY(-1px); }

    /* ---------- Saved-copy reader ---------- */
    .reader-wrap { margin-bottom: 18px; }
    .reader-toggle {
      width: 100%;
      display: flex; align-items: center; gap: 11px;
      font-family: var(--display);
      font-weight: 600;
      font-size: 0.92rem;
      color: var(--text);
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--card-edge);
      border-radius: 10px;
      padding: 13px 16px;
      cursor: pointer;
      text-align: left;
      transition: border-color 0.2s ease, background 0.2s ease, transform 0.15s ease, box-shadow 0.2s ease;
    }
    .reader-toggle:hover {
      border-color: var(--type-color, var(--rose));
      background: color-mix(in srgb, var(--type-color, var(--rose)) 8%, transparent);
      transform: translateY(-1px);
      box-shadow: 0 8px 22px -14px color-mix(in srgb, var(--type-color, var(--rose)) 60%, transparent);
    }
    .reader-toggle:active { transform: scale(0.995); }
    .reader-toggle:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
    .rt-ico { font-size: 1rem; line-height: 1; }
    .rt-meta {
      margin-left: auto;
      font-family: var(--mono);
      font-weight: 400;
      font-size: 0.62rem;
      letter-spacing: 0.1em;
      color: var(--muted);
      white-space: nowrap;
    }
    .rt-chev {
      color: var(--muted);
      font-size: 0.85rem;
      transition: transform 0.4s cubic-bezier(0.22, 0.9, 0.3, 1);
    }
    .reader-wrap.open .rt-chev { transform: rotate(180deg); }
    .reader-wrap.open .reader-toggle { border-bottom-radius: 0; border-bottom-color: transparent; }

    .reader {
      display: grid;
      grid-template-rows: 0fr;
      transition: grid-template-rows 0.5s cubic-bezier(0.22, 0.9, 0.3, 1);
    }
    .reader-wrap.open .reader { grid-template-rows: 1fr; }
    .reader-inner { overflow: hidden; min-height: 0; }

    .article {
      background:
        repeating-linear-gradient(to bottom, transparent 0 30px, rgba(255, 255, 255, 0.018) 30px 31px),
        linear-gradient(180deg, #121820, #0f141b);
      border: 1px solid var(--card-edge);
      border-top: none;
      border-radius: 0 0 12px 12px;
      padding: 24px 30px 28px;
      box-shadow: inset 0 10px 24px -18px rgba(0, 0, 0, 0.9);
    }
    .article-note {
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.08em;
      line-height: 1.7;
      color: var(--muted);
      border: 1px dashed color-mix(in srgb, var(--green) 38%, transparent);
      background: color-mix(in srgb, var(--green) 5%, transparent);
      border-radius: 8px;
      padding: 10px 13px;
      margin-bottom: 22px;
    }
    .article-note b { color: var(--green); font-weight: 600; }

    .article .rd-h1 {
      font-family: var(--display);
      font-size: 1.26rem;
      font-weight: 700;
      letter-spacing: -0.01em;
      color: var(--text);
      margin: 30px 0 12px;
      padding-left: 13px;
      border-left: 3px solid var(--type-color, var(--rose));
      line-height: 1.25;
    }
    .article .rd-h1:first-of-type { margin-top: 0; }
    .article .rd-h2 {
      font-family: var(--display);
      font-size: 1.05rem;
      font-weight: 600;
      color: #d3dae2;
      margin: 24px 0 10px;
    }
    .article .rd-h3 {
      font-family: var(--mono);
      font-size: 0.72rem;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--rose);
      margin: 20px 0 8px;
    }
    .article .rd-p {
      font-size: 1.03rem;
      line-height: 1.88;
      color: #c8d0d9;
      margin: 0 0 15px;
    }
    .article .rd-p.dropcap::first-letter {
      font-family: var(--display);
      font-weight: 700;
      font-size: 3.4em;
      float: left;
      line-height: 0.8;
      padding: 0.05em 0.13em 0 0;
      color: var(--type-color, var(--rose));
    }
    .article .rd-ul { list-style: none; margin: 0 0 16px; }
    .article .rd-ol { margin: 0 0 16px 20px; }
    .article .rd-li {
      font-size: 1rem;
      line-height: 1.78;
      color: #c8d0d9;
      margin-bottom: 9px;
    }
    .article .rd-ul .rd-li { position: relative; padding-left: 20px; }
    .article .rd-ul .rd-li::before {
      content: '▸';
      position: absolute; left: 2px; top: 0.15em;
      color: var(--rose);
      font-size: 0.8rem;
    }
    .article .rd-ol .rd-li::marker {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--rose);
    }
    .article .rd-a {
      color: #7fc0f5;
      text-decoration: none;
      border-bottom: 1px dotted rgba(127, 192, 245, 0.55);
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .article .rd-a:hover { color: var(--blue); border-bottom-style: solid; }
    .article strong { color: #eef2f6; font-weight: 600; }
    .article .rd-pre {
      position: relative;
      background: #0b0f14;
      border: 1px solid var(--card-edge);
      border-radius: 8px;
      padding: 16px 18px;
      margin: 4px 0 16px;
      overflow-x: auto;
      font-family: var(--mono);
      font-size: 0.78rem;
      line-height: 1.65;
      color: #b9c2cd;
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.02);
    }
    .article .rd-pre code { font-family: var(--mono); white-space: pre; }
    .article .rd-code-lang {
      position: absolute; top: 8px; right: 12px;
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: color-mix(in srgb, var(--rose) 70%, transparent);
    }
    .article .rd-quote {
      border-left: 2px solid color-mix(in srgb, var(--rose) 50%, transparent);
      padding-left: 14px;
      margin: 0 0 15px;
      font-style: italic;
      color: #b3bcc6;
      font-size: 0.98rem;
      line-height: 1.72;
    }

    .reader-loading {
      font-family: var(--mono);
      font-size: 0.76rem;
      letter-spacing: 0.14em;
      color: var(--muted);
      padding: 6px 2px;
      animation: pulse 1.4s ease-in-out infinite;
    }
    @keyframes pulse { 0%, 100% { opacity: 0.5; } 50% { opacity: 1; } }

    .endmark {
      margin-top: 26px;
      text-align: center;
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.5em;
      color: color-mix(in srgb, var(--rose) 60%, transparent);
    }

    /* ---------- Source footer ---------- */
    .sources {
      display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px 16px;
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      border-top: 1px solid rgba(255, 255, 255, 0.06);
      padding-top: 13px;
    }
    .src-label {
      font-size: 0.58rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--muted);
    }
    .sources a {
      color: #cdd5de;
      text-decoration: none;
      border-bottom: 1px dotted rgba(205, 213, 222, 0.4);
      padding-bottom: 1px;
      transition: color 0.2s ease, border-color 0.2s ease;
    }
    .sources a:hover { color: var(--type-color, var(--rose)); border-color: var(--type-color, var(--rose)); }

    /* ---------- Card actions ---------- */
    .clip-meta { display: flex; align-items: center; gap: 12px; }
    .act-btn {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: var(--mono);
      font-size: 0.58rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--muted);
      background: rgba(255, 255, 255, 0.02);
      border: 1px dashed var(--card-edge);
      border-radius: 999px;
      padding: 5px 11px;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.2s ease, border-color 0.2s ease, background 0.2s ease, transform 0.15s ease, opacity 0.2s ease;
    }
    .act-btn .act-ico { font-size: 0.78rem; line-height: 1; }
    .act-btn:focus-visible { outline: 2px solid var(--rose); outline-offset: 2px; }
    .act-btn:active { transform: scale(0.96); }
    .archive-btn { opacity: 0.4; }
    .clip:hover .archive-btn, .archive-btn:focus-visible { opacity: 1; }
    .archive-btn:hover {
      color: var(--amber);
      border-style: solid;
      border-color: color-mix(in srgb, var(--amber) 55%, transparent);
      background: color-mix(in srgb, var(--amber) 8%, transparent);
      transform: translateY(-1px);
    }
    .restore-btn:hover {
      color: var(--green);
      border-style: solid;
      border-color: color-mix(in srgb, var(--green) 50%, transparent);
      background: color-mix(in srgb, var(--green) 8%, transparent);
      transform: translateY(-1px);
    }
    @media (hover: none) { .archive-btn { opacity: 0.75; } }

    .clip.leaving {
      opacity: 0 !important;
      transform: translateX(48px) scale(0.97) !important;
      transition: opacity 0.3s ease, transform 0.3s ease !important;
      pointer-events: none;
    }

    /* ---------- Filed-away drawer ---------- */
    .archive-zone { margin-top: 48px; }
    .archive-head {
      width: 100%;
      display: flex; align-items: center; gap: 12px;
      background: none; border: none;
      padding: 0 0 16px;
      cursor: pointer;
      font-family: var(--mono);
      color: var(--muted);
    }
    .az-rule {
      flex: 1; height: 1px;
      background: repeating-linear-gradient(to right, rgba(255, 255, 255, 0.13) 0 6px, transparent 6px 12px);
    }
    .az-ico { font-size: 0.9rem; }
    .az-label {
      font-size: 0.66rem;
      letter-spacing: 0.26em;
      text-transform: uppercase;
      color: var(--amber);
      transition: color 0.2s ease;
    }
    .archive-head:hover .az-label { color: color-mix(in srgb, var(--amber) 65%, var(--text)); }
    .az-count {
      font-size: 0.62rem;
      letter-spacing: 0.12em;
      color: var(--amber);
      border: 1px solid color-mix(in srgb, var(--amber) 40%, transparent);
      background: color-mix(in srgb, var(--amber) 8%, transparent);
      border-radius: 999px;
      padding: 2px 8px;
    }
    .az-chev { font-size: 0.8rem; transition: transform 0.35s cubic-bezier(0.22, 0.9, 0.3, 1); }
    .archive-zone.open .az-chev { transform: rotate(180deg); }
    .archived-stack { display: none; }
    .archive-zone.open .archived-stack { display: flex; }
    .archived-stack .clip { opacity: 0.72; }
    .archived-stack .clip .ribbon { filter: grayscale(0.5) brightness(0.8); transition: filter 0.25s ease; }
    .archived-stack .clip:hover { opacity: 1; }
    .archived-stack .clip:hover .ribbon { filter: none; }

    /* ---------- Toast ---------- */
    .toast {
      position: fixed;
      left: 50%; bottom: 26px;
      z-index: 60;
      transform: translate(-50%, 14px);
      display: flex; align-items: center; gap: 14px;
      max-width: calc(100vw - 40px);
      background: #171d26;
      border: 1px solid var(--card-edge);
      border-radius: 10px;
      padding: 12px 16px;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.08em;
      color: var(--text);
      box-shadow: 0 18px 44px -14px rgba(0, 0, 0, 0.75);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease, transform 0.3s ease;
      overflow: hidden;
    }
    .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
    .toast .undo {
      font-family: var(--mono);
      font-size: 0.62rem;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: var(--rose);
      background: transparent;
      border: 1px solid color-mix(in srgb, var(--rose) 45%, transparent);
      border-radius: 6px;
      padding: 5px 11px;
      cursor: pointer;
      transition: background 0.2s ease, transform 0.15s ease;
    }
    .toast .undo:hover { background: color-mix(in srgb, var(--rose) 12%, transparent); }
    .toast .undo:active { transform: scale(0.96); }
    .toast-bar {
      position: absolute; left: 0; bottom: 0;
      height: 2px; width: 100%;
      background: var(--rose);
      opacity: 0.65;
      transform-origin: left;
      animation: toastbar 5.2s linear forwards;
    }
    @keyframes toastbar { from { transform: scaleX(1); } to { transform: scaleX(0); } }

    /* ---------- States ---------- */
    .notice {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
      border: 1.5px dashed var(--card-edge);
      border-radius: 12px;
      padding: 34px 24px;
      text-align: center;
      letter-spacing: 0.06em;
    }

    /* ---------- Footer ---------- */
    .foot {
      margin-top: 54px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .foot a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid rgba(233, 237, 242, 0.3);
      padding-bottom: 1px;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .foot a:hover { border-color: var(--rose); color: var(--rose); }

    @media (max-width: 560px) {
      body { padding: 40px 16px 64px; }
      .clip { padding: 22px 18px 16px; }
      .ribbon { left: 18px; }
      .clip-top { padding-left: 22px; }
      .masthead { flex-direction: column; }
      .stamp { align-self: flex-start; transform: rotate(-1.5deg); }
      .article { padding: 20px 18px 24px; }
      .rt-meta { display: none; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="rules"></div></div>

  <main class="page">
    <header class="masthead reveal" style="--d: 0ms">
      <div>
        <p class="eyebrow">Clawd Pages · Collection</p>
        <h1>Reading Stack</h1>
        <p class="tagline">Articles and posts saved to come back to — full copies kept on the shelf, not just links.</p>
      </div>
      <div class="stamp" id="stamp" hidden><span id="stamp-count">0</span><br>SAVED</div>
    </header>

    <section class="stack" id="stack" aria-live="polite">
      <div class="notice">Opening the shelf…</div>
    </section>

    <section class="archive-zone" id="archive-zone" hidden>
      <button type="button" class="archive-head" id="zone-toggle" aria-expanded="false" aria-controls="archived-stack">
        <span class="az-rule" aria-hidden="true"></span>
        <span class="az-ico" aria-hidden="true">🗄</span>
        <span class="az-label">Filed away</span>
        <span class="az-count" id="zone-count">000</span>
        <span class="az-chev" aria-hidden="true">▾</span>
        <span class="az-rule" aria-hidden="true"></span>
      </button>
      <div class="stack archived-stack" id="archived-stack"></div>
    </section>

    <footer class="foot reveal" style="--d: 120ms">
      <a href="../">← Clawd Pages</a>
      <span>curated by Clawd 🐾</span>
    </footer>
  </main>

  <div class="toast" id="toast" role="status">
    <span id="toast-msg">Filed away</span>
    <button type="button" class="undo" id="toast-undo">Undo</button>
    <span class="toast-bar" id="toast-bar" aria-hidden="true"></span>
  </div>

  <script>
    (function () {
      var TYPE_LABEL = { tweet: '𝕏 Post', article: '¶ Article', video: '▶ Video', note: '✎ Note' };
      var TYPE_GLYPH = { tweet: '𝕏', article: '¶', video: '▶', note: '✎' };
      var MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

      function fmtDate(iso) {
        var d = new Date(iso + 'T00:00:00');
        if (isNaN(d)) return iso;
        return MONTHS[d.getMonth()] + ' ' + String(d.getDate()).padStart(2, '0') + ' ' + d.getFullYear();
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function pad(n) { return String(n).padStart(3, '0'); }

      /* ---- tiny markdown renderer (headings, lists, bold, links) ---- */
      function inline(s) {
        s = esc(s);
        s = s.replace(/\[([^\]]+)\]\((https?:\/\/[^)\s]+)\)/g, function (m, t, u) {
          return '<a class="rd-a" href="' + u + '" target="_blank" rel="noopener">' + t + '</a>';
        });
        s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
        return s;
      }
      function headingTag(lvl) { return lvl === 1 ? 'h3' : (lvl === 2 ? 'h4' : 'h5'); }
      function mdToHtml(md) {
        var lines = String(md).replace(/\r\n/g, '\n').split('\n');
        var out = [];
        var para = [];
        var quote = [];
        var listType = null;
        var firstP = true;
        var inCode = false;
        var codeLang = '';
        var codeBuf = [];
        function flushPara() {
          if (para.length) {
            var cls = firstP ? 'rd-p dropcap' : 'rd-p';
            firstP = false;
            out.push('<p class="' + cls + '">' + inline(para.join(' ')) + '</p>');
            para = [];
          }
        }
        function closeList() {
          if (listType) { out.push('</' + listType + '>'); listType = null; }
        }
        function flushQuote() {
          if (quote.length) {
            out.push('<blockquote class="rd-quote">' + quote.map(function (q) { return inline(q); }).join('<br>') + '</blockquote>');
            quote = [];
          }
        }
        function closeCode() {
          var label = codeLang ? '<span class="rd-code-lang">' + esc(codeLang) + '</span>' : '';
          out.push('<pre class="rd-pre">' + label + '<code>' + esc(codeBuf.join('\n')) + '</code></pre>');
          inCode = false; codeBuf = []; codeLang = '';
        }
        for (var i = 0; i < lines.length; i++) {
          var line = lines[i];
          var fence = line.match(/^\s*```(\w*)\s*$/);
          if (fence) {
            if (!inCode) {
              flushPara(); closeList(); flushQuote();
              inCode = true; codeLang = fence[1] || ''; codeBuf = [];
            } else {
              closeCode();
            }
            continue;
          }
          if (inCode) { codeBuf.push(line); continue; }
          var q = line.match(/^\s*>\s?(.*)$/);
          if (q) { flushPara(); closeList(); quote.push(q[1]); continue; }
          flushQuote();
          var h = line.match(/^(#{1,4})\s+(.+)$/);
          if (h) {
            flushPara(); closeList();
            var lvl = h[1].length;
            var cls2 = lvl === 1 ? 'rd-h1' : (lvl === 2 ? 'rd-h2' : 'rd-h3');
            var tag = headingTag(lvl);
            out.push('<' + tag + ' class="' + cls2 + '">' + inline(h[2]) + '</' + tag + '>');
            continue;
          }
          var ul = line.match(/^\s*[-*]\s+(.+)$/);
          if (ul) {
            flushPara();
            if (listType !== 'ul') { closeList(); out.push('<ul class="rd-ul">'); listType = 'ul'; }
            out.push('<li class="rd-li">' + inline(ul[1]) + '</li>');
            continue;
          }
          var ol = line.match(/^\s*\d+[.)]\s+(.+)$/);
          if (ol) {
            flushPara();
            if (listType !== 'ol') { closeList(); out.push('<ol class="rd-ol">'); listType = 'ol'; }
            out.push('<li class="rd-li">' + inline(ol[1]) + '</li>');
            continue;
          }
          if (line.trim() === '') { flushPara(); closeList(); continue; }
          para.push(line.trim());
        }
        if (inCode) closeCode();
        flushPara(); closeList(); flushQuote();
        return out.join('\n');
      }

      /* ---- reader: lazy-load the saved copy ---- */
      var contentCache = {};
      function loadContent(btn) {
        var path = btn.getAttribute('data-path');
        var bodyId = btn.getAttribute('aria-controls');
        var article = document.getElementById(bodyId).querySelector('.article');
        var savedLabel = btn.getAttribute('data-saved');
        if (contentCache[path]) { article.innerHTML = contentCache[path]; return; }
        article.innerHTML = '<p class="reader-loading">Unfolding the saved copy…</p>';
        fetch(path)
          .then(function (r) {
            if (!r.ok) throw new Error('load failed');
            return r.text();
          })
          .then(function (md) {
            var by = btn.getAttribute('data-authors') || btn.getAttribute('data-author') || '';
            var pub = btn.getAttribute('data-published');
            var who = by ? ('<br>by ' + esc(by)) : '';
            var when = pub ? (' · published ' + esc(fmtDate(pub))) : '';
            var note =
              '<p class="article-note">📌 <b>Saved copy</b>' + who + when +
              ' — captured ' + esc(fmtDate(savedLabel)) +
              ' and stored right here on the shelf. Read it even if the original changes or disappears.</p>';
            var html = note + mdToHtml(md) + '<p class="endmark">· · ·</p>';
            contentCache[path] = html;
            article.innerHTML = html;
          })
          .catch(function () {
            article.innerHTML = '<p class="reader-loading">Couldn’t load the saved copy — check your connection and try again.</p>';
          });
      }

      document.getElementById('stack').addEventListener('click', function (ev) {
        var btn = ev.target.closest('.reader-toggle');
        if (!btn) return;
        var wrap = btn.closest('.reader-wrap');
        var willOpen = !wrap.classList.contains('open');
        wrap.classList.toggle('open', willOpen);
        btn.setAttribute('aria-expanded', willOpen ? 'true' : 'false');
        if (willOpen) {
          var article = document.getElementById(btn.getAttribute('aria-controls')).querySelector('.article');
          if (article.getAttribute('data-loaded') !== 'true') {
            article.setAttribute('data-loaded', 'true');
            loadContent(btn);
          }
        }
      });

      function summaryHtml(e) {
        if (e.summary) {
          var tk = (e.summary.takeaways || []).map(function (t) { return '<li>' + esc(t) + '</li>'; }).join('');
          return (
            '<section class="summary">' +
              '<p class="summary-label">Clawd’s notes</p>' +
              '<p class="summary-text">' + esc(e.summary.text) + '</p>' +
              (tk ? '<ul class="takeaways">' + tk + '</ul>' : '') +
            '</section>'
          );
        }
        if (e.excerpt) return '<blockquote class="excerpt">' + esc(e.excerpt) + '</blockquote>';
        return '';
      }

      function readerHtml(e, idx) {
        if (!e.contentPath) return '';
        var bodyId = 'rd-body-' + idx;
        var meta = e.readMin ? ('~' + e.readMin + ' min · saved copy') : 'saved copy';
        return (
          '<div class="reader-wrap">' +
            '<button type="button" class="reader-toggle" aria-expanded="false" aria-controls="' + bodyId + '"' +
              ' data-path="' + esc(e.contentPath) + '" data-saved="' + esc(e.saved || '') + '"' +
              ' data-author="' + esc(e.author || '') + '" data-authors="' + esc(e.authors || '') + '"' +
              ' data-published="' + esc(e.published || '') + '">' +
              '<span class="rt-ico" aria-hidden="true">📖</span>' +
              '<span>Read the full saved copy</span>' +
              '<span class="rt-meta">' + esc(meta) + '</span>' +
              '<span class="rt-chev" aria-hidden="true">▾</span>' +
            '</button>' +
            '<div class="reader" id="' + bodyId + '">' +
              '<div class="reader-inner"><div class="article" data-loaded="false"></div></div>' +
            '</div>' +
          '</div>'
        );
      }

      function sourcesHtml(e, type) {
        var orig = type === 'tweet' ? 'Original 𝕏 post' : 'Original';
        var links = '<a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + orig + ' ↗</a>';
        (e.links || []).forEach(function (l) {
          links += '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + ' ↗</a>';
        });
        return '<div class="sources"><span class="src-label">Source</span>' + links + '</div>';
      }

      /* ---- archiving (per-browser, stored in localStorage) ---- */
      var STORE_KEY = 'clawd-reading:archived';
      var archived = (function () {
        try {
          var raw = JSON.parse(localStorage.getItem(STORE_KEY) || '[]');
          return new Set(Array.isArray(raw) ? raw : []);
        } catch (e) { return new Set(); }
      })();
      function persistArchived() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(Array.from(archived))); } catch (e) {}
      }
      function entryKey(e) { return e.url + '|' + (e.contentPath || ''); }

      var allEntries = [];
      var zoneOpen = false;

      function cardHtml(e, i, isFiled) {
        var num = pad(allEntries.length - i);
        var type = e.type || 'note';
        var label = TYPE_LABEL[type] || TYPE_LABEL.note;
        var glyph = TYPE_GLYPH[type] || TYPE_GLYPH.note;
        var byline = e.author ? esc(e.author) : '';
        if (e.handle) {
          var profile = type === 'tweet' ? 'https://x.com/' + esc(e.handle) : '#';
          byline += ' · <a href="' + profile + '" target="_blank" rel="noopener">@' + esc(e.handle) + '</a>';
        }
        var chips = (e.tags || []).map(function (t) {
          return '<span class="chip">#' + esc(t) + '</span>';
        }).join('');
        var key = esc(entryKey(e));
        var action = isFiled
          ? '<button type="button" class="act-btn restore-btn" data-key="' + key + '"><span class="act-ico" aria-hidden="true">↩</span> Restore</button>'
          : '<button type="button" class="act-btn archive-btn" data-key="' + key + '" title="File this off the shelf"><span class="act-ico" aria-hidden="true">🗄</span> Archive</button>';
        return (
          '<article class="clip reveal" style="--d:' + (140 + Math.min(i, 5) * 80) + 'ms" data-type="' + esc(type) + '">' +
            '<div class="ribbon" aria-hidden="true"></div>' +
            '<div class="clip-top">' +
              '<span class="src"><span class="glyph" aria-hidden="true">' + glyph + '</span>' + label + '</span>' +
              '<span class="clip-meta">' +
                '<span class="saved">SAVED ' + fmtDate(e.saved) + ' · № ' + num + '</span>' +
                action +
              '</span>' +
            '</div>' +
            '<h2><a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.title) + '</a></h2>' +
            (byline ? '<p class="byline">by ' + byline + '</p>' : '') +
            summaryHtml(e) +
            (chips ? '<div class="chips">' + chips + '</div>' : '') +
            readerHtml(e, i) +
            sourcesHtml(e, type) +
          '</article>'
        );
      }

      function renderShelf() {
        var stack = document.getElementById('stack');
        var stamp = document.getElementById('stamp');
        var zone = document.getElementById('archive-zone');
        var zoneStack = document.getElementById('archived-stack');

        if (!allEntries.length) {
          stack.innerHTML = '<div class="notice">The shelf is empty — send me something worth keeping.</div>';
          zone.hidden = true;
          return;
        }

        var active = [], filed = [];
        allEntries.forEach(function (e, i) {
          (archived.has(entryKey(e)) ? filed : active).push({ e: e, i: i });
        });

        document.getElementById('stamp-count').textContent = pad(active.length);
        stamp.hidden = false;

        stack.innerHTML = active.length
          ? active.map(function (r) { return cardHtml(r.e, r.i, false); }).join('')
          : '<div class="notice">The shelf is clear — everything is filed away below. 🗄</div>';

        document.getElementById('zone-count').textContent = pad(filed.length);
        zone.hidden = filed.length === 0;
        zoneStack.innerHTML = filed.map(function (r) { return cardHtml(r.e, r.i, true); }).join('');
      }

      /* ---- filed-away drawer toggle ---- */
      document.getElementById('zone-toggle').addEventListener('click', function () {
        zoneOpen = !zoneOpen;
        document.getElementById('archive-zone').classList.toggle('open', zoneOpen);
        this.setAttribute('aria-expanded', zoneOpen ? 'true' : 'false');
      });

      /* ---- toast with undo ---- */
      var toastTimer = null;
      var undoFn = null;
      function showToast(msg, undo) {
        var toast = document.getElementById('toast');
        document.getElementById('toast-msg').textContent = msg;
        undoFn = undo || null;
        document.getElementById('toast-undo').hidden = !undoFn;
        toast.classList.add('show');
        var bar = document.getElementById('toast-bar');
        bar.style.animation = 'none';
        void bar.offsetWidth;
        bar.style.animation = '';
        clearTimeout(toastTimer);
        toastTimer = setTimeout(hideToast, 5200);
      }
      function hideToast() {
        clearTimeout(toastTimer);
        document.getElementById('toast').classList.remove('show');
        undoFn = null;
      }
      document.getElementById('toast-undo').addEventListener('click', function () {
        if (undoFn) undoFn();
        hideToast();
      });

      /* ---- archive / restore ---- */
      document.addEventListener('click', function (ev) {
        var ab = ev.target.closest('.archive-btn');
        if (ab) {
          var card = ab.closest('.clip');
          var key = ab.getAttribute('data-key');
          card.classList.add('leaving');
          setTimeout(function () {
            archived.add(key);
            persistArchived();
            renderShelf();
            showToast('Filed away — off the shelf.', function () {
              archived.delete(key);
              persistArchived();
              renderShelf();
            });
          }, 300);
          return;
        }
        var rb = ev.target.closest('.restore-btn');
        if (rb) {
          var key2 = rb.getAttribute('data-key');
          archived.delete(key2);
          persistArchived();
          renderShelf();
          showToast('Back on the shelf.', function () {
            archived.add(key2);
            persistArchived();
            renderShelf();
          });
        }
      });

      fetch('./reading.json', { cache: 'no-cache' })
        .then(function (r) { return r.json(); })
        .then(function (d) { allEntries = d.entries || []; renderShelf(); })
        .catch(function () {
          document.getElementById('stack').innerHTML =
            '<div class="notice">Couldn’t open the shelf — try again in a moment.</div>';
        });
    })();
  </script>
</body>
</html>
