<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Reading Stack · Clawd Pages</title>
  <meta name="description" content="Articles and posts Jason saved to come back to.">
  <meta name="theme-color" content="#0e1116">
  <link rel="manifest" href="../manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png">
  <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0e1116;
      --card: #151a21;
      --card-edge: #242c37;
      --text: #e9edf2;
      --muted: #8b95a3;
      --rose: #ef6a7a;
      --blue: #1d9bf0;
      --amber: #f7b955;
      --green: #3ddc84;
      --display: 'Space Grotesk', ui-sans-serif, sans-serif;
      --serif: 'Lora', Georgia, serif;
      --mono: 'JetBrains Mono', ui-monospace, monospace;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { min-height: 100%; }
    body {
      font-family: var(--serif);
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
      position: relative;
      padding: 56px 20px 80px;
    }

    /* ---------- Ambient: layered glow + faint ruled paper ---------- */
    .bg { position: fixed; inset: 0; z-index: -1; }
    .bg::before, .bg::after {
      content: '';
      position: absolute;
      width: 620px; height: 620px;
      border-radius: 50%;
      filter: blur(10px);
    }
    .bg::before {
      left: -180px; top: -220px;
      background: radial-gradient(circle, rgba(239, 106, 122, 0.13), transparent 65%);
      animation: drift 18s ease-in-out infinite alternate;
    }
    .bg::after {
      right: -200px; bottom: -240px;
      background: radial-gradient(circle, rgba(29, 155, 240, 0.10), transparent 65%);
      animation: drift 21s ease-in-out -7s infinite alternate-reverse;
    }
    .bg .rules {
      position: absolute; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0 31px,
        rgba(255, 255, 255, 0.028) 31px 32px
      );
      -webkit-mask-image: radial-gradient(ellipse 100% 90% at 50% 30%, #000 20%, transparent 100%);
      mask-image: radial-gradient(ellipse 100% 90% at 50% 30%, #000 20%, transparent 100%);
    }
    @keyframes drift {
      from { transform: translate(0, 0) scale(1); }
      to   { transform: translate(42px, 30px) scale(1.07); }
    }

    .page { max-width: 680px; margin: 0 auto; position: relative; }

    /* Notebook margin line (desktop) */
    @media (min-width: 720px) {
      .page::before {
        content: '';
        position: absolute;
        left: -34px; top: 8px; bottom: 0;
        width: 1px;
        background: linear-gradient(to bottom, rgba(239, 106, 122, 0.55), rgba(239, 106, 122, 0.06));
      }
    }

    .reveal { animation: rise 0.6s cubic-bezier(0.22, 0.9, 0.3, 1) backwards; animation-delay: var(--d, 0ms); }
    @keyframes rise { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

    /* ---------- Masthead ---------- */
    .masthead {
      display: flex; align-items: flex-start; justify-content: space-between; gap: 20px;
      margin-bottom: 44px;
    }
    .eyebrow {
      font-family: var(--mono);
      font-size: 0.66rem;
      letter-spacing: 0.28em;
      text-transform: uppercase;
      color: var(--rose);
      margin-bottom: 10px;
    }
    h1 {
      font-family: var(--display);
      font-size: clamp(2.1rem, 6vw, 2.9rem);
      font-weight: 700;
      letter-spacing: -0.02em;
      line-height: 1.05;
    }
    .tagline {
      font-style: italic;
      color: var(--muted);
      font-size: 0.98rem;
      margin-top: 12px;
      max-width: 38ch;
    }
    .stamp {
      flex: 0 0 auto;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.14em;
      color: var(--rose);
      border: 1.5px dashed rgba(239, 106, 122, 0.5);
      padding: 10px 12px;
      border-radius: 6px;
      transform: rotate(-2.5deg);
      text-align: center;
      line-height: 1.5;
      white-space: nowrap;
      margin-top: 8px;
      background: rgba(239, 106, 122, 0.04);
    }

    /* ---------- Stack ---------- */
    .stack { display: flex; flex-direction: column; gap: 26px; }

    .clip {
      position: relative;
      background: var(--card);
      border: 1px solid var(--card-edge);
      border-radius: 14px;
      padding: 26px 26px 22px;
      transition: transform 0.25s ease, border-color 0.25s ease, box-shadow 0.25s ease;
    }
    .clip:hover {
      transform: translateY(-3px);
      border-color: rgba(239, 106, 122, 0.4);
      box-shadow: 0 18px 40px -20px rgba(0, 0, 0, 0.7);
    }

    /* Bookmark ribbon, color-coded by type */
    .ribbon {
      position: absolute;
      left: 26px; top: -9px;
      width: 15px; height: 58px;
      background: var(--type-color, var(--rose));
      clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 86%, 0 100%);
      box-shadow: 0 6px 14px -6px rgba(0, 0, 0, 0.6);
      transition: height 0.25s ease, transform 0.25s ease;
    }
    .clip:hover .ribbon { height: 66px; }
    .clip[data-type="tweet"]   { --type-color: var(--blue); }
    .clip[data-type="article"] { --type-color: var(--amber); }
    .clip[data-type="video"]   { --type-color: var(--green); }
    .clip[data-type="note"]    { --type-color: var(--rose); }

    .clip-top {
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
      margin-bottom: 14px;
      padding-left: 26px;
    }
    .src {
      display: inline-flex; align-items: center; gap: 8px;
      font-family: var(--mono);
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--type-color, var(--rose));
    }
    .glyph {
      display: grid; place-items: center;
      width: 22px; height: 22px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      background: color-mix(in srgb, var(--type-color, var(--rose)) 16%, transparent);
      border: 1px solid color-mix(in srgb, var(--type-color, var(--rose)) 34%, transparent);
    }
    .clip[data-type="tweet"] .glyph   { font-family: var(--display); }
    .saved {
      font-family: var(--mono);
      font-size: 0.64rem;
      letter-spacing: 0.12em;
      color: var(--muted);
      white-space: nowrap;
    }

    .clip h2 {
      font-family: var(--display);
      font-size: 1.32rem;
      font-weight: 600;
      letter-spacing: -0.01em;
      line-height: 1.3;
      margin-bottom: 6px;
    }
    .clip h2 a {
      color: var(--text);
      text-decoration: none;
      background-image: linear-gradient(var(--rose), var(--rose));
      background-size: 0% 2px;
      background-repeat: no-repeat;
      background-position: 0 100%;
      transition: background-size 0.3s ease;
    }
    .clip h2 a:hover { background-size: 100% 2px; }

    .byline {
      font-family: var(--mono);
      font-size: 0.7rem;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 16px;
    }
    .byline a { color: var(--muted); text-decoration: none; border-bottom: 1px dotted rgba(139, 149, 163, 0.5); }
    .byline a:hover { color: var(--text); }

    .excerpt {
      font-size: 1.02rem;
      line-height: 1.7;
      color: #c7cdd6;
      border-left: 2px solid rgba(239, 106, 122, 0.5);
      padding-left: 16px;
      margin-bottom: 18px;
    }

    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 18px; }
    .chip {
      font-family: var(--mono);
      font-size: 0.64rem;
      letter-spacing: 0.08em;
      color: var(--muted);
      border: 1px solid var(--card-edge);
      padding: 4px 9px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.02);
    }

    .links { display: flex; flex-wrap: wrap; gap: 14px; }
    .links a {
      font-family: var(--display);
      font-weight: 600;
      font-size: 0.85rem;
      color: var(--text);
      text-decoration: none;
      padding: 8px 14px;
      border-radius: 10px;
      border: 1px solid var(--card-edge);
      background: rgba(255, 255, 255, 0.03);
      transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
    }
    .links a:hover {
      transform: translateY(-2px);
      border-color: var(--type-color, var(--rose));
      background: color-mix(in srgb, var(--type-color, var(--rose)) 10%, transparent);
    }
    .links .primary {
      background: color-mix(in srgb, var(--type-color, var(--rose)) 16%, transparent);
      border-color: color-mix(in srgb, var(--type-color, var(--rose)) 42%, transparent);
    }

    /* ---------- States ---------- */
    .notice {
      font-family: var(--mono);
      font-size: 0.78rem;
      color: var(--muted);
      border: 1.5px dashed var(--card-edge);
      border-radius: 12px;
      padding: 34px 24px;
      text-align: center;
      letter-spacing: 0.06em;
    }

    /* ---------- Footer ---------- */
    .foot {
      margin-top: 54px;
      display: flex; align-items: center; justify-content: space-between; gap: 14px;
      font-family: var(--mono);
      font-size: 0.68rem;
      letter-spacing: 0.1em;
      color: var(--muted);
    }
    .foot a {
      color: var(--text);
      text-decoration: none;
      border-bottom: 1px solid rgba(233, 237, 242, 0.3);
      padding-bottom: 1px;
      transition: border-color 0.2s ease, color 0.2s ease;
    }
    .foot a:hover { border-color: var(--rose); color: var(--rose); }

    @media (max-width: 520px) {
      body { padding: 40px 16px 64px; }
      .clip { padding: 22px 18px 18px; }
      .ribbon { left: 18px; }
      .clip-top { padding-left: 22px; }
      .masthead { flex-direction: column; }
      .stamp { align-self: flex-start; transform: rotate(-1.5deg); }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { animation: none !important; transition: none !important; }
    }
  </style>
</head>
<body>
  <div class="bg" aria-hidden="true"><div class="rules"></div></div>

  <main class="page">
    <header class="masthead reveal" style="--d: 0ms">
      <div>
        <p class="eyebrow">Clawd Pages · Collection</p>
        <h1>Reading Stack</h1>
        <p class="tagline">Articles and posts saved to come back to — a slow shelf, kept by Clawd.</p>
      </div>
      <div class="stamp" id="stamp" hidden><span id="stamp-count">0</span><br>SAVED</div>
    </header>

    <section class="stack" id="stack" aria-live="polite">
      <div class="notice">Opening the shelf…</div>
    </section>

    <footer class="foot reveal" style="--d: 120ms">
      <a href="../">← Clawd Pages</a>
      <span>curated by Clawd 🐾</span>
    </footer>
  </main>

  <script>
    (function () {
      var TYPE_LABEL = { tweet: '𝕏 Post', article: '¶ Article', video: '▶ Video', note: '✎ Note' };
      var TYPE_GLYPH = { tweet: '𝕏', article: '¶', video: '▶', note: '✎' };
      var MONTHS = ['JAN','FEB','MAR','APR','MAY','JUN','JUL','AUG','SEP','OCT','NOV','DEC'];

      function fmtDate(iso) {
        var d = new Date(iso + 'T00:00:00');
        if (isNaN(d)) return iso;
        return MONTHS[d.getMonth()] + ' ' + String(d.getDate()).padStart(2, '0') + ' ' + d.getFullYear();
      }
      function esc(s) {
        return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
          return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
        });
      }
      function pad(n) { return String(n).padStart(3, '0'); }

      function render(entries) {
        var stack = document.getElementById('stack');
        var stamp = document.getElementById('stamp');
        if (!entries || !entries.length) {
          stack.innerHTML = '<div class="notice">The shelf is empty — send me something worth keeping.</div>';
          return;
        }
        var total = entries.length;
        document.getElementById('stamp-count').textContent = pad(total);
        stamp.hidden = false;

        stack.innerHTML = entries.map(function (e, i) {
          var num = pad(total - i); // №001 = first saved
          var type = e.type || 'note';
          var label = TYPE_LABEL[type] || TYPE_LABEL.note;
          var glyph = TYPE_GLYPH[type] || TYPE_GLYPH.note;
          var byline = e.author ? esc(e.author) : '';
          if (e.handle) {
            var profile = type === 'tweet' ? 'https://x.com/' + esc(e.handle) : '#';
            byline += ' · <a href="' + profile + '" target="_blank" rel="noopener">@' + esc(e.handle) + '</a>';
          }
          var chips = (e.tags || []).map(function (t) {
            return '<span class="chip">#' + esc(t) + '</span>';
          }).join('');
          var links = '<a class="primary" href="' + esc(e.url) + '" target="_blank" rel="noopener">' +
            (type === 'tweet' ? 'Open on 𝕏 ↗' : 'Open ↗') + '</a>';
          (e.links || []).forEach(function (l) {
            links += '<a href="' + esc(l.url) + '" target="_blank" rel="noopener">' + esc(l.label) + ' ↗</a>';
          });
          return (
            '<article class="clip reveal" style="--d:' + (140 + i * 90) + 'ms" data-type="' + esc(type) + '">' +
              '<div class="ribbon" aria-hidden="true"></div>' +
              '<div class="clip-top">' +
                '<span class="src"><span class="glyph" aria-hidden="true">' + glyph + '</span>' + label + '</span>' +
                '<span class="saved">SAVED ' + fmtDate(e.saved) + ' · № ' + num + '</span>' +
              '</div>' +
              '<h2><a href="' + esc(e.url) + '" target="_blank" rel="noopener">' + esc(e.title) + '</a></h2>' +
              (byline ? '<p class="byline">by ' + byline + '</p>' : '') +
              (e.excerpt ? '<blockquote class="excerpt">' + esc(e.excerpt) + '</blockquote>' : '') +
              (chips ? '<div class="chips">' + chips + '</div>' : '') +
              '<div class="links">' + links + '</div>' +
            '</article>'
          );
        }).join('');
      }

      fetch('./reading.json', { cache: 'no-cache' })
        .then(function (r) { return r.json(); })
        .then(function (d) { render(d.entries); })
        .catch(function () {
          document.getElementById('stack').innerHTML =
            '<div class="notice">Couldn’t open the shelf — try again in a moment.</div>';
        });
    })();
  </script>
</body>
</html>
